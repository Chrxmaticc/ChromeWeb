<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromeWeb – Account</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 70 70' fill='none'%3E%3Ccircle cx='35' cy='35' r='34' stroke='%23c0c0c0' stroke-width='2'/%3E%3Cpath d='M20 25h30v20H20z' fill='none' stroke='%23c0c0c0' stroke-width='2'/%3E%3Cpath d='M25 30l10 10-10 10' stroke='%23c0c0c0' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #000; color: #fff; overflow-x: hidden;
      min-height: 100vh; position: relative;
      display: flex; flex-direction: column;
    }
    #vanta-bg, #vanta-bg-light { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; pointer-events:none; }
    #vanta-dots, #vanta-dots-light { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; opacity:0.3; }
    #vanta-bg-light, #vanta-dots-light { display:none; }

    .topbar {
      position:relative; z-index:1000; padding:16px 40px;
      display:flex; justify-content:space-between; align-items:center;
      background: rgba(0,0,0,0.85); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .topbar .logo { display:flex; align-items:center; gap:10px; font-size:1.3rem; font-weight:900; text-decoration:none; }
    .topbar .logo svg { width:32px; height:32px; }
    .topbar .logo span { background:linear-gradient(135deg,#fff,#aaa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .topbar nav { display:flex; align-items:center; gap:28px; }
    .topbar nav a { color:#aaa; text-decoration:none; font-size:0.95rem; transition:color 0.2s; }
    .topbar nav a:hover { color:#fff; }

    .theme-toggle-btn {
      background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15);
      border-radius:9999px; padding:0.5rem 1rem; cursor:pointer; display:flex; align-items:center; gap:0.5rem;
      color:#c0c0c0; font-size:0.85rem; font-weight:500; transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .theme-toggle-btn:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25); color:#fff; }
    .toggle-track { display:flex; align-items:center; gap:0.4rem; }
    .toggle-icons { position:relative; width:18px; height:18px; }
    .sun-icon, .moon-icon { position:absolute; top:0; left:0; transition:opacity 0.3s, transform 0.5s; }
    [data-theme="dark"] .moon-icon { opacity:1; transform:rotate(0deg); }
    [data-theme="dark"] .sun-icon { opacity:0; transform:rotate(90deg); }
    [data-theme="light"] .moon-icon { opacity:0; transform:rotate(-90deg); }
    [data-theme="light"] .sun-icon { opacity:1; transform:rotate(0deg); }
    .toggle-label::after { content:'Light'; }
    [data-theme="light"] .toggle-label::after { content:'Dark'; }

    .main {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:2rem; position:relative; z-index:2;
    }

    .accounts-card {
      width:100%; max-width:420px;
      background: rgba(18,18,18,0.55); backdrop-filter: blur(16px);
      border-radius: 2rem;
      border:1px solid rgba(192,192,192,0.15);
      padding:2.5rem 2rem;
      box-shadow:0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06);
      transform-style: preserve-3d;
      perspective:1000px;
      transition: transform 0.2s ease-out;
    }
    .accounts-card h2 {
      font-size:1.8rem; font-weight:700; text-align:center; margin-bottom:1.5rem;
      background: linear-gradient(135deg,#fff,#aaa);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .form-group { margin-bottom:1.2rem; }
    .form-group label { display:block; font-size:0.85rem; color:#b0b0b0; margin-bottom:0.4rem; }
    .input-wrapper {
      display:flex; align-items:center; gap:10px;
      background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
      border-radius:12px; padding:0.7rem 1rem; transition: border-color 0.3s;
    }
    .input-wrapper:focus-within { border-color:#808080; }
    .input-wrapper svg { color:#808080; flex-shrink:0; }
    .input-wrapper input {
      background:transparent; border:none; outline:none;
      color:#fff; font-size:1rem; width:100%; font-family:inherit;
    }
    .input-wrapper input::placeholder { color:#555; }

    .btn {
      width:100%; padding:0.9rem; border-radius:9999px; font-weight:600; font-size:1rem;
      color:#0a0a0a; background:linear-gradient(135deg,#e0e0e0,#808080);
      border:none; cursor:pointer; margin-top:1rem;
      box-shadow:0 10px 20px rgba(192,192,192,0.15);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
      text-align:center;
    }
    .btn:hover { transform:scale(1.02); box-shadow:0 15px 30px rgba(192,192,192,0.3); }
    .alt-action { text-align:center; margin-top:1.2rem; font-size:0.9rem; color:#b0b0b0; }
    .alt-action a { color:#c0c0c0; text-decoration:none; font-weight:600; }
    .alt-action a:hover { color:#fff; }

    .form-login, .form-register { display:none; }
    .form-login.active, .form-register.active { display:block; }

    .footer {
      text-align:center; padding:20px; border-top:1px solid rgba(255,255,255,0.05);
      color:rgba(255,255,255,0.2); font-size:0.8rem; position:relative; z-index:2;
    }
    .footer a { color:rgba(255,255,255,0.4); text-decoration:none; }

    /* Light mode overrides */
    [data-theme="light"] body { background:#f7f7f7; }
    [data-theme="light"] .topbar { background:rgba(255,255,255,0.85); border-bottom-color:rgba(0,0,0,0.1); }
    [data-theme="light"] .topbar .logo span { background:linear-gradient(135deg,#333,#555); -webkit-background-clip:text; background-clip:text; }
    [data-theme="light"] .topbar nav a { color:#555; }
    [data-theme="light"] .topbar nav a:hover { color:#000; }
    [data-theme="light"] .theme-toggle-btn { background:rgba(0,0,0,0.05); border-color:rgba(0,0,0,0.15); color:#333; }
    [data-theme="light"] .theme-toggle-btn:hover { background:rgba(0,0,0,0.1); border-color:rgba(0,0,0,0.25); color:#000; }
    [data-theme="light"] .accounts-card { background:rgba(255,255,255,0.6); border-color:rgba(0,0,0,0.1); }
    [data-theme="light"] .accounts-card h2 { background:linear-gradient(135deg,#222,#888); -webkit-background-clip:text; background-clip:text; }
    [data-theme="light"] .form-group label { color:#555; }
    [data-theme="light"] .input-wrapper { background:rgba(0,0,0,0.03); border-color:rgba(0,0,0,0.1); }
    [data-theme="light"] .input-wrapper input { color:#222; }
    [data-theme="light"] .input-wrapper input::placeholder { color:#999; }
    [data-theme="light"] .btn { color:#0a0a0a; background:linear-gradient(135deg,#e0e0e0,#808080); }
    [data-theme="light"] .alt-action { color:#555; }
    [data-theme="light"] .alt-action a { color:#333; }
    [data-theme="light"] .footer { border-top-color:rgba(0,0,0,0.1); color:rgba(0,0,0,0.3); }
    [data-theme="light"] .footer a { color:rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>
  <div id="vanta-dots"></div>
  <div id="vanta-bg-light"></div>
  <div id="vanta-dots-light"></div>

  <header class="topbar">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 70 70" fill="none">
        <circle cx="35" cy="35" r="34" stroke="url(#grad)" stroke-width="2"/>
        <path d="M20 25h30v20H20z" fill="none" stroke="url(#grad)" stroke-width="2"/>
        <path d="M25 30l10 10-10 10" stroke="url(#grad)" stroke-width="2" fill="none"/>
        <defs><linearGradient id="grad" x1="0" y1="0" x2="70" y2="70"><stop stop-color="#fff"/><stop offset="1" stop-color="#808080"/></linearGradient></defs>
      </svg>
      <span>ChromeWeb</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="store.html">Store</a>
      <a href="app.html">Dashboard</a>
      <a href="docs.html">Docs</a>
      <button class="theme-toggle-btn" id="themeToggle">
        <span class="toggle-track">
          <span class="toggle-icons">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
          <span class="toggle-label"></span>
        </span>
      </button>
    </nav>
  </header>

  <div class="main">
    <div class="accounts-card" id="accountsCard">
      <!-- Login Form -->
      <div class="form-login active" id="loginForm">
        <h2>Welcome back</h2>
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
            <input type="email" placeholder="you@example.com" id="loginEmail">
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" placeholder="••••••••" id="loginPassword">
          </div>
        </div>
        <button class="btn" id="loginBtn">Log In</button>
        <p class="alt-action">Don't have an account? <a href="#" id="showRegister">Sign up</a></p>
      </div>

      <!-- Register Form -->
      <div class="form-register" id="registerForm">
        <h2>Create account</h2>
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
            <input type="text" placeholder="cooluser" id="regUser">
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
            <input type="email" placeholder="you@example.com" id="regEmail">
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" placeholder="••••••••" id="regPassword">
          </div>
        </div>
        <button class="btn" id="registerBtn">Create Account</button>
        <p class="alt-action">Already have an account? <a href="#" id="showLogin">Log in</a></p>
      </div>
    </div>
  </div>

  <footer class="footer">
    ChromeWeb &copy; 2026 — <a href="#">GitHub</a> · <a href="#">Twitter</a> · <a href="#">Discord</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
  <script>
    // Vanta backgrounds
    VANTA.GLOBE({ el: "#vanta-bg", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0xeeeeee, size: 2, backgroundColor: 0x0 });
    VANTA.DOTS({ el: "#vanta-dots", mouseControls: false, touchControls: false, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0xd7d7d7, color2: 0xd7d7d7, size: 1.6, spacing: 15, showLines: false, backgroundColor: 0x0 });
    VANTA.GLOBE({ el: "#vanta-bg-light", mouseControls: false, touchControls: false, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0x1b191a, color2: 0xf0e0e, size: 0.9, backgroundColor: 0xf7f7f7 });
    VANTA.DOTS({ el: "#vanta-dots-light", mouseControls: false, touchControls: false, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0x141313, color2: 0x80808, size: 1.6, spacing: 15, showLines: false, backgroundColor: 0xf7f2f2 });

    // Theme toggle
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const darkBg = document.getElementById('vanta-bg');
    const darkDots = document.getElementById('vanta-dots');
    const lightBg = document.getElementById('vanta-bg-light');
    const lightDots = document.getElementById('vanta-dots-light');
    function applyTheme(t) {
      if (t === 'light') {
        darkBg.style.display = 'none'; darkDots.style.display = 'none';
        lightBg.style.display = 'block'; lightDots.style.display = 'block';
      } else {
        darkBg.style.display = 'block'; darkDots.style.display = 'block';
        lightBg.style.display = 'none'; lightDots.style.display = 'none';
      }
      window.dispatchEvent(new Event('resize'));
    }
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    applyTheme(savedTheme);
    themeToggle.addEventListener('click', () => {
      const cur = html.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    // Form switching
    document.getElementById('showRegister').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('registerForm').classList.add('active');
    });
    document.getElementById('showLogin').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('registerForm').classList.remove('active');
      document.getElementById('loginForm').classList.add('active');
    });

    // Registration
    document.getElementById('registerBtn').addEventListener('click', async () => {
      const username = document.getElementById('regUser').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      if (!username || !email || !password) return alert('All fields required.');
      if (password.length < 6) return alert('Password must be at least 6 characters.');
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
        });
        const data = await res.json();
        if (res.ok) {
          alert('Registration successful! Please log in.');
          document.getElementById('registerForm').classList.remove('active');
          document.getElementById('loginForm').classList.add('active');
          document.getElementById('regUser').value = '';
          document.getElementById('regEmail').value = '';
          document.getElementById('regPassword').value = '';
        } else {
          alert(data.error || 'Registration failed.');
        }
      } catch (err) {
        alert('Network error. Is the API running?');
      }
    });

    // Login
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) return alert('Email and password required.');
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('chromeweb_token', data.token);
          localStorage.setItem('chromeweb_user', JSON.stringify(data.user));
          window.location.href = 'app.html';
        } else {
          alert(data.error || 'Login failed.');
        }
      } catch (err) {
        alert('Network error. Is the API running?');
      }
    });

    // 3D tilt on card
    const card = document.getElementById('accountsCard');
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const rotateY = ((x - rect.width/2) / (rect.width/2)) * 4;
      const rotateX = ((y - rect.height/2) / (rect.height/2)) * -4;
      card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
    });
  </script>
</body>
</html>
