<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromeWeb – Dashboard</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 70 70' fill='none'%3E%3Ccircle cx='35' cy='35' r='34' stroke='%23c0c0c0' stroke-width='2'/%3E%3Cpath d='M20 25h30v20H20z' fill='none' stroke='%23c0c0c0' stroke-width='2'/%3E%3Cpath d='M25 30l10 10-10 10' stroke='%23c0c0c0' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #000; color: #fff; overflow-x: hidden;
      min-height: 100vh; position: relative;
    }
    #vanta-bg, #vanta-bg-light { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; pointer-events:none; }
    #vanta-dots, #vanta-dots-light { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; opacity:0.3; }
    #vanta-bg-light, #vanta-dots-light { display:none; }

    .topbar {
      position:relative; z-index:1000; padding:16px 40px;
      display:flex; justify-content:space-between; align-items:center;
      background: rgba(0,0,0,0.85); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .topbar .logo { display:flex; align-items:center; gap:10px; font-size:1.3rem; font-weight:900; text-decoration:none; }
    .topbar .logo svg { width:32px; height:32px; }
    .topbar .logo span { background:linear-gradient(135deg,#fff,#aaa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .topbar nav { display:flex; align-items:center; gap:28px; }
    .topbar nav a { color:#aaa; text-decoration:none; font-size:0.95rem; transition:color 0.2s; }
    .topbar nav a:hover { color:#fff; }

    .theme-toggle-btn {
      background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15);
      border-radius:9999px; padding:0.5rem 1rem; cursor:pointer; display:flex; align-items:center; gap:0.5rem;
      color:#c0c0c0; font-size:0.85rem; font-weight:500; transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .theme-toggle-btn:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25); color:#fff; }
    .toggle-track { display:flex; align-items:center; gap:0.4rem; }
    .toggle-icons { position:relative; width:18px; height:18px; }
    .sun-icon, .moon-icon { position:absolute; top:0; left:0; transition:opacity 0.3s, transform 0.5s; }
    [data-theme="dark"] .moon-icon { opacity:1; transform:rotate(0deg); }
    [data-theme="dark"] .sun-icon { opacity:0; transform:rotate(90deg); }
    [data-theme="light"] .moon-icon { opacity:0; transform:rotate(-90deg); }
    [data-theme="light"] .sun-icon { opacity:1; transform:rotate(0deg); }
    .toggle-label::after { content:'Light'; }
    [data-theme="light"] .toggle-label::after { content:'Dark'; }

    .dashboard-layout { position:relative; z-index:2; display:flex; min-height:calc(100vh - 73px); }
    .sidebar {
      width:250px; background: rgba(10,10,10,0.7); backdrop-filter:blur(12px);
      border-right:1px solid rgba(255,255,255,0.05); padding:2rem 1rem;
      display:flex; flex-direction:column; gap:1rem;
    }
    .sidebar button {
      background: transparent; border: none; color: #b0b0b0; font-size:1rem;
      padding:0.75rem 1rem; border-radius:12px; cursor:pointer; text-align:left;
      transition: all 0.2s; display:flex; align-items:center; gap:0.75rem;
    }
    .sidebar button svg { width:1.2rem; height:1.2rem; }
    .sidebar button:hover, .sidebar button.active { background: rgba(255,255,255,0.06); color: #fff; }
    .content-area { flex:1; padding:2rem; position:relative; overflow-y:auto; }
    .panel { display:none; }
    .panel.active { display:block; }

    /* Music player */
    .music-player {
      background: rgba(18,18,18,0.55); backdrop-filter: blur(16px);
      border:1px solid rgba(192,192,192,0.15); border-radius:2rem;
      padding:2rem; max-width:400px; margin:0 auto;
      box-shadow:0 30px 60px rgba(0,0,0,0.8);
    }
    .music-player .cover {
      width:100%; aspect-ratio:1/1; border-radius:1.5rem;
      background: linear-gradient(135deg, #222, #111);
      display:flex; align-items:center; justify-content:center;
      margin-bottom:1.5rem; overflow:hidden;
    }
    .music-player .cover img { width:100%; height:100%; object-fit:cover; }
    .music-player .controls {
      display:flex; justify-content:space-between; align-items:center; margin:1.5rem 0;
    }
    .music-player .controls button {
      background: rgba(255,255,255,0.1); border: none; color: #fff;
      width:40px; height:40px; border-radius:50%; display:flex; align-items:center;
      justify-content:center; cursor:pointer; transition:0.2s;
    }
    .music-player .controls button:hover { background: rgba(255,255,255,0.2); }
    .progress-bar { height:4px; background:#333; border-radius:2px; overflow:hidden; cursor:pointer; }
    .progress-fill { height:100%; background:linear-gradient(to right, #c0c0c0, #e0e0e0); width:0%; }
    input, select, textarea { font-family:inherit; }

    /* Light mode overrides */
    [data-theme="light"] body { background:#f7f7f7; }
    [data-theme="light"] .topbar { background:rgba(255,255,255,0.85); border-bottom-color:rgba(0,0,0,0.1); }
    [data-theme="light"] .topbar .logo span { background:linear-gradient(135deg,#333,#555); -webkit-background-clip:text; background-clip:text; }
    [data-theme="light"] .topbar nav a { color:#555; }
    [data-theme="light"] .topbar nav a:hover { color:#000; }
    [data-theme="light"] .theme-toggle-btn { background:rgba(0,0,0,0.05); border-color:rgba(0,0,0,0.15); color:#333; }
    [data-theme="light"] .theme-toggle-btn:hover { background:rgba(0,0,0,0.1); border-color:rgba(0,0,0,0.25); color:#000; }
    [data-theme="light"] .sidebar { background:rgba(255,255,255,0.6); }
    [data-theme="light"] .sidebar button { color:#555; }
    [data-theme="light"] .sidebar button:hover, [data-theme="light"] .sidebar button.active { background:rgba(0,0,0,0.05); color:#000; }
    [data-theme="light"] .music-player { background:rgba(255,255,255,0.6); border-color:rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>
  <div id="vanta-dots"></div>
  <div id="vanta-bg-light"></div>
  <div id="vanta-dots-light"></div>

  <header class="topbar">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 70 70" fill="none">
        <circle cx="35" cy="35" r="34" stroke="url(#grad)" stroke-width="2"/>
        <path d="M20 25h30v20H20z" fill="none" stroke="url(#grad)" stroke-width="2"/>
        <path d="M25 30l10 10-10 10" stroke="url(#grad)" stroke-width="2" fill="none"/>
        <defs><linearGradient id="grad" x1="0" y1="0" x2="70" y2="70"><stop stop-color="#fff"/><stop offset="1" stop-color="#808080"/></linearGradient></defs>
      </svg>
      <span>ChromeWeb</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="store.html">Store</a>
      <a href="app.html">Dashboard</a>
      <a href="docs.html">Docs</a>
      <button class="theme-toggle-btn" id="themeToggle">
        <span class="toggle-track">
          <span class="toggle-icons">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
          <span class="toggle-label"></span>
        </span>
      </button>
    </nav>
  </header>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <button class="active" data-panel="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <button data-panel="store">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        Store
      </button>
      <button data-panel="music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        Music Player
      </button>
      <button data-panel="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        Settings
      </button>
    </aside>

    <main class="content-area">
      <!-- Dashboard Panel -->
      <div class="panel active" id="panel-dashboard">
        <h2 style="font-weight:700;margin-bottom:1rem;">Mod Manager</h2>
        <div id="installedMods" style="display:flex;flex-direction:column;gap:0.5rem;"></div>
        <button id="publishModBtn" style="margin-top:1rem;padding:0.5rem 1rem;background:linear-gradient(135deg,#e0e0e0,#808080);color:#0a0a0a;border:none;border-radius:8px;font-weight:600;cursor:pointer;">Publish New Mod to Database</button>
      </div>

      <!-- Store Panel (redirect card) -->
      <div class="panel" id="panel-store" style="text-align:center;padding-top:5rem;">
        <h2 style="font-weight:700;margin-bottom:1rem;">ChromeWeb Marketplace</h2>
        <p style="color:#b0b0b0;margin-bottom:2rem;">Browse community mods, themes, and plugins.</p>
        <a href="store.html" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.8rem 2rem;background:linear-gradient(135deg,#e0e0e0,#808080);color:#0a0a0a;border-radius:9999px;font-weight:600;text-decoration:none;">
          Open Store
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
        </a>
      </div>

      <!-- Music Player Panel -->
      <div class="panel" id="panel-music">
        <div class="music-player">
          <div class="cover" id="musicCover">
            <!-- default music icon SVG -->
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <div id="musicTitle" style="font-weight:600;text-align:center;margin-bottom:0.25rem;">No track loaded</div>
          <div id="musicArtist" style="font-size:0.85rem;color:#aaa;text-align:center;"></div>
          <div class="progress-bar" id="musicProgress" style="margin:1rem 0 0.5rem;">
            <div class="progress-fill" id="musicProgressFill"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:#aaa;margin-bottom:1rem;">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
          <div class="controls">
            <button id="repeatBtn" title="Repeat: off">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
            </button>
            <button id="prevBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>
            <button id="playPauseBtn" style="width:56px;height:56px;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>
            </button>
            <button id="nextBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
            <button id="shuffleBtn" title="Shuffle: off">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            </button>
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem;margin-top:1rem;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" style="flex:1;">
          </div>
          <div style="display:flex;gap:0.5rem;margin-top:1rem;">
            <input type="text" id="trackUrlInput" placeholder="Paste audio URL or file path" style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:0.5rem;color:#fff;">
            <button id="addTrackBtn" style="padding:0.5rem 1rem;background:linear-gradient(135deg,#e0e0e0,#808080);color:#0a0a0a;border:none;border-radius:8px;font-weight:600;">Add</button>
          </div>
        </div>
      </div>

      <!-- Settings Panel -->
      <div class="panel" id="panel-settings">
        <h2 style="font-weight:700;margin-bottom:1rem;">Settings</h2>
        <div id="userInfo" style="margin-bottom:2rem;"></div>
        <div style="margin-bottom:1rem;">
          <label style="display:block;color:#aaa;">Default Font</label>
          <input type="text" id="defaultFontInput" placeholder="e.g. Inter" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:0.5rem;color:#fff;">
        </div>
        <button id="logoutBtn" style="padding:0.75rem 2rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:9999px;font-weight:600;cursor:pointer;">Log Out</button>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
  <script>
    // Vanta backgrounds
    VANTA.GLOBE({ el: "#vanta-bg", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0xeeeeee, size: 2, backgroundColor: 0x0 });
    VANTA.DOTS({ el: "#vanta-dots", mouseControls: false, touchControls: false, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0xd7d7d7, color2: 0xd7d7d7, size: 1.6, spacing: 15, showLines: false, backgroundColor: 0x0 });
    VANTA.GLOBE({ el: "#vanta-bg-light", mouseControls: false, touchControls: false, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0x1b191a, color2: 0xf0e0e, size: 0.9, backgroundColor: 0xf7f7f7 });
    VANTA.DOTS({ el: "#vanta-dots-light", mouseControls: false, touchControls: false, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0x141313, color2: 0x80808, size: 1.6, spacing: 15, showLines: false, backgroundColor: 0xf7f2f2 });

    // Theme toggle
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const darkBg = document.getElementById('vanta-bg');
    const darkDots = document.getElementById('vanta-dots');
    const lightBg = document.getElementById('vanta-bg-light');
    const lightDots = document.getElementById('vanta-dots-light');
    function applyTheme(t) {
      if (t === 'light') {
        darkBg.style.display = 'none'; darkDots.style.display = 'none';
        lightBg.style.display = 'block'; lightDots.style.display = 'block';
      } else {
        darkBg.style.display = 'block'; darkDots.style.display = 'block';
        lightBg.style.display = 'none'; lightDots.style.display = 'none';
      }
      window.dispatchEvent(new Event('resize'));
    }
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    applyTheme(savedTheme);
    themeToggle.addEventListener('click', () => {
      const cur = html.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    // Sidebar navigation
    const buttons = document.querySelectorAll('.sidebar button');
    const panels = document.querySelectorAll('.panel');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const panelId = btn.dataset.panel;
        panels.forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${panelId}`).classList.add('active');
      });
    });

    // Music player logic
    const audio = new Audio();
    let playlist = [];
    let currentTrackIndex = -1;
    let repeatMode = 'off';
    let shuffle = false;

    const coverDiv = document.getElementById('musicCover');
    const titleEl = document.getElementById('musicTitle');
    const artistEl = document.getElementById('musicArtist');
    const progressBar = document.getElementById('musicProgress');
    const progressFill = document.getElementById('musicProgressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const trackUrlInput = document.getElementById('trackUrlInput');
    const addTrackBtn = document.getElementById('addTrackBtn');

    audio.volume = 0.8;

    function formatTime(sec) {
      sec = Math.floor(sec) || 0;
      const mins = Math.floor(sec / 60);
      const remain = sec % 60;
      return `${mins}:${remain.toString().padStart(2, '0')}`;
    }

    function loadTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      const track = playlist[index];
      audio.src = track.url;
      currentTrackIndex = index;
      titleEl.textContent = track.name || 'Unknown';
      artistEl.textContent = track.artist || '';
      if (track.cover) {
        coverDiv.innerHTML = `<img src="${track.cover}" alt="cover">`;
      } else {
        coverDiv.innerHTML = '<svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
      }
      audio.play().catch(() => {});
      updatePlayPauseIcon();
    }

    function updatePlayPauseIcon() {
      if (audio.paused) {
        playPauseBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>';
      } else {
        playPauseBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
      }
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('ended', () => {
      if (repeatMode === 'one') {
        audio.currentTime = 0;
        audio.play();
      } else {
        nextTrack();
      }
    });

    function nextTrack() {
      if (shuffle && playlist.length > 1) {
        let next;
        do { next = Math.floor(Math.random() * playlist.length); } while (next === currentTrackIndex && playlist.length > 1);
        loadTrack(next);
      } else {
        let next = currentTrackIndex + 1;
        if (next >= playlist.length) {
          if (repeatMode === 'all') next = 0;
          else { audio.pause(); updatePlayPauseIcon(); return; }
        }
        loadTrack(next);
      }
    }

    function prevTrack() {
      if (currentTrackIndex > 0) loadTrack(currentTrackIndex - 1);
      else if (repeatMode === 'all') loadTrack(playlist.length - 1);
    }

    playPauseBtn.addEventListener('click', () => {
      if (playlist.length === 0) return;
      if (audio.paused) {
        if (currentTrackIndex === -1) loadTrack(0);
        else audio.play();
      } else audio.pause();
    });

    document.getElementById('nextBtn').addEventListener('click', nextTrack);
    document.getElementById('prevBtn').addEventListener('click', prevTrack);

    repeatBtn.addEventListener('click', () => {
      if (repeatMode === 'off') { repeatMode = 'one'; repeatBtn.title = 'Repeat: one'; repeatBtn.style.color = '#c0c0c0'; }
      else if (repeatMode === 'one') { repeatMode = 'all'; repeatBtn.title = 'Repeat: all'; }
      else { repeatMode = 'off'; repeatBtn.title = 'Repeat: off'; repeatBtn.style.color = ''; }
    });

    shuffleBtn.addEventListener('click', () => {
      shuffle = !shuffle;
      shuffleBtn.title = shuffle ? 'Shuffle: on' : 'Shuffle: off';
      shuffleBtn.style.color = shuffle ? '#c0c0c0' : '';
    });

    progressBar.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressBar.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    });

    volumeSlider.addEventListener('input', (e) => { audio.volume = parseFloat(e.target.value); });

    addTrackBtn.addEventListener('click', () => {
      const url = trackUrlInput.value.trim();
      if (url) {
        const name = prompt('Track name (optional):') || url.split('/').pop();
        const cover = prompt('Cover image URL (optional):') || '';
        playlist.push({ url, name, cover });
        if (currentTrackIndex === -1) loadTrack(0);
        trackUrlInput.value = '';
      }
    });

    // Auth / user display
    function getUser() {
      const token = localStorage.getItem('chromeweb_token');
      if (!token) return null;
      const users = JSON.parse(localStorage.getItem('chromeweb_users') || '[]');
      return users.find(u => u.token === token);
    }
    const user = getUser();
    const userInfoDiv = document.getElementById('userInfo');
    if (user) {
      userInfoDiv.innerHTML = `<div style="display:flex;align-items:center;gap:1rem;">
        <div style="width:48px;height:48px;border-radius:50%;background:rgba(192,192,192,0.15);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.5rem;color:#c0c0c0;">${user.username.charAt(0).toUpperCase()}</div>
        <div><strong>${user.username}</strong><br><span style="color:#aaa;">${user.email}</span></div>
      </div>`;
    } else {
      userInfoDiv.innerHTML = '<p><a href="accounts.html" style="color:#c0c0c0;">Sign in</a> to manage your account.</p>';
    }
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('chromeweb_token');
      window.location.reload();
    });

    // Installed mods list
    const installedMods = JSON.parse(localStorage.getItem('installed_mods') || '[]');
    const installedDiv = document.getElementById('installedMods');
    installedDiv.innerHTML = installedMods.length ? installedMods.map(m => `<div style="background:rgba(255,255,255,0.03);padding:0.5rem 1rem;border-radius:8px;">${m.name}</div>`).join('') : '<p style="color:#aaa;">No mods installed yet.</p>';

    // Publish mod functionality
    document.getElementById('publishModBtn').addEventListener('click', async () => {
      if (!getUser()) return alert('You must be logged in to publish mods.');
      const name = prompt('Mod name:');
      if (!name) return;
      const type = prompt('Type (css, js, html):');
      const description = prompt('Short description:');
      const content = prompt('Paste the full code:');
      try {
        const res = await fetch('/api/mods', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description, author: getUser().username, type, content }),
        });
        const data = await res.json();
        if (res.ok) {
          alert('Mod published!');
          // Optionally add to installed mods
          const mods = JSON.parse(localStorage.getItem('installed_mods') || '[]');
          mods.push({ name, type });
          localStorage.setItem('installed_mods', JSON.stringify(mods));
          // Refresh list
          installedDiv.innerHTML = mods.map(m => `<div style="background:rgba(255,255,255,0.03);padding:0.5rem 1rem;border-radius:8px;">${m.name}</div>`).join('');
        } else {
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to reach server.');
      }
    });
  </script>
</body>
</html>
