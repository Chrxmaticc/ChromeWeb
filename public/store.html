<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromeWeb – Store</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 70 70' fill='none'%3E%3Ccircle cx='35' cy='35' r='34' stroke='%23c0c0c0' stroke-width='2'/%3E%3Cpath d='M20 25h30v20H20z' fill='none' stroke='%23c0c0c0' stroke-width='2'/%3E%3Cpath d='M25 30l10 10-10 10' stroke='%23c0c0c0' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #000; color: #fff; overflow-x: hidden; min-height: 100vh; position: relative; }
    #vanta-bg, #vanta-bg-light { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; pointer-events:none; }
    #vanta-dots, #vanta-dots-light { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; opacity:0.3; }
    #vanta-bg-light, #vanta-dots-light { display:none; }

    .topbar {
      position:relative; z-index:1000; padding:16px 40px;
      display:flex; justify-content:space-between; align-items:center;
      background: rgba(0,0,0,0.85); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .topbar .logo { display:flex; align-items:center; gap:10px; font-size:1.3rem; font-weight:900; text-decoration:none; }
    .topbar .logo svg { width:32px; height:32px; }
    .topbar .logo span { background:linear-gradient(135deg,#fff,#aaa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .topbar nav { display:flex; align-items:center; gap:28px; }
    .topbar nav a { color:#aaa; text-decoration:none; font-size:0.95rem; transition:color 0.2s; }
    .topbar nav a:hover { color:#fff; }

    .theme-toggle-btn {
      background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15);
      border-radius:9999px; padding:0.5rem 1rem; cursor:pointer; display:flex; align-items:center; gap:0.5rem;
      color:#c0c0c0; font-size:0.85rem; font-weight:500; transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .theme-toggle-btn:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25); color:#fff; }
    .toggle-track { display:flex; align-items:center; gap:0.4rem; }
    .toggle-icons { position:relative; width:18px; height:18px; }
    .sun-icon, .moon-icon { position:absolute; top:0; left:0; transition:opacity 0.3s, transform 0.5s; }
    [data-theme="dark"] .moon-icon { opacity:1; transform:rotate(0deg); }
    [data-theme="dark"] .sun-icon { opacity:0; transform:rotate(90deg); }
    [data-theme="light"] .moon-icon { opacity:0; transform:rotate(-90deg); }
    [data-theme="light"] .sun-icon { opacity:1; transform:rotate(0deg); }
    .toggle-label::after { content:'Light'; }
    [data-theme="light"] .toggle-label::after { content:'Dark'; }

    .store-container {
      position:relative; z-index:2; max-width:1200px; margin:0 auto; padding:2rem;
    }
    .shimmer-title {
      font-size: clamp(2.5rem, 6vw, 4rem); font-weight:800; text-align:center; margin-bottom:2rem;
      background: linear-gradient(90deg, #ffffff, #c0c0c0, #ffffff);
      background-size: 200% 100%;
      -webkit-background-clip:text; background-clip:text; color:transparent;
      animation: shimmer 2.5s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:200% center} 100%{background-position:-200% center} }

    .mods-grid {
      display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:1.5rem;
    }
    .glass-card {
      background: rgba(18,18,18,0.55); backdrop-filter: blur(16px);
      border:1px solid rgba(192,192,192,0.15); border-radius:1.5rem;
      padding:1.5rem; box-shadow:0 20px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      transition: transform 0.2s ease-out, border-color 0.3s;
      transform-style: preserve-3d;
    }
    .glass-card:hover { border-color: rgba(192,192,192,0.4); }
    .glass-card h3 { font-size:1.2rem; margin-bottom:0.5rem; }
    .glass-card p { color:#b0b0b0; font-size:0.9rem; margin-bottom:0.5rem; }
    .install-btn {
      padding:0.5rem 1rem; background:linear-gradient(135deg,#e0e0e0,#808080); color:#0a0a0a;
      border:none; border-radius:9999px; font-weight:600; cursor:pointer; margin-top:0.5rem;
    }

    .footer {
      text-align:center; padding:20px; border-top:1px solid rgba(255,255,255,0.05);
      color:rgba(255,255,255,0.2); font-size:0.8rem; position:relative; z-index:2;
    }

    [data-theme="light"] body { background:#f7f7f7; }
    [data-theme="light"] .topbar { background:rgba(255,255,255,0.85); border-bottom-color:rgba(0,0,0,0.1); }
    [data-theme="light"] .topbar .logo span { background:linear-gradient(135deg,#333,#555); -webkit-background-clip:text; background-clip:text; }
    [data-theme="light"] .topbar nav a { color:#555; }
    [data-theme="light"] .topbar nav a:hover { color:#000; }
    [data-theme="light"] .theme-toggle-btn { background:rgba(0,0,0,0.05); border-color:rgba(0,0,0,0.15); color:#333; }
    [data-theme="light"] .theme-toggle-btn:hover { background:rgba(0,0,0,0.1); border-color:rgba(0,0,0,0.25); color:#000; }
    [data-theme="light"] .glass-card { background:rgba(255,255,255,0.6); border-color:rgba(0,0,0,0.1); }
    [data-theme="light"] .footer { border-top-color:rgba(0,0,0,0.1); color:rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>
  <div id="vanta-dots"></div>
  <div id="vanta-bg-light"></div>
  <div id="vanta-dots-light"></div>

  <header class="topbar">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 70 70" fill="none"><circle cx="35" cy="35" r="34" stroke="url(#grad)" stroke-width="2"/><path d="M20 25h30v20H20z" fill="none" stroke="url(#grad)" stroke-width="2"/><path d="M25 30l10 10-10 10" stroke="url(#grad)" stroke-width="2" fill="none"/><defs><linearGradient id="grad" x1="0" y1="0" x2="70" y2="70"><stop stop-color="#fff"/><stop offset="1" stop-color="#808080"/></linearGradient></defs></svg>
      <span>ChromeWeb</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="store.html">Store</a>
      <a href="app.html">Dashboard</a>
      <a href="docs.html">Docs</a>
      <button class="theme-toggle-btn" id="themeToggle"><span class="toggle-track"><span class="toggle-icons"><svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span><span class="toggle-label"></span></span></button>
    </nav>
  </header>

  <main class="store-container">
    <h1 class="shimmer-title">ChromeWeb Marketplace</h1>
    <div class="mods-grid" id="modsGrid">
      <p style="color:#aaa;">Loading mods...</p>
    </div>
  </main>

  <footer class="footer">
    ChromeWeb &copy; 2026 — <a href="#" style="color:rgba(255,255,255,0.4);">GitHub</a> · <a href="#" style="color:rgba(255,255,255,0.4);">Discord</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>
  <script>
    VANTA.GLOBE({ el: "#vanta-bg", mouseControls: true, touchControls: true, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0xeeeeee, size: 2, backgroundColor: 0x0 });
    VANTA.DOTS({ el: "#vanta-dots", mouseControls: false, touchControls: false, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0xd7d7d7, color2: 0xd7d7d7, size: 1.6, spacing: 15, showLines: false, backgroundColor: 0x0 });
    VANTA.GLOBE({ el: "#vanta-bg-light", mouseControls: false, touchControls: false, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0x1b191a, color2: 0xf0e0e, size: 0.9, backgroundColor: 0xf7f7f7 });
    VANTA.DOTS({ el: "#vanta-dots-light", mouseControls: false, touchControls: false, gyroControls: false, minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1, color: 0x141313, color2: 0x80808, size: 1.6, spacing: 15, showLines: false, backgroundColor: 0xf7f2f2 });

    const html = document.documentElement;
    const toggleBtn = document.getElementById('themeToggle');
    const darkBg = document.getElementById('vanta-bg'), darkDots = document.getElementById('vanta-dots');
    const lightBg = document.getElementById('vanta-bg-light'), lightDots = document.getElementById('vanta-dots-light');
    function applyTheme(t) {
      if (t === 'light') {
        darkBg.style.display = 'none'; darkDots.style.display = 'none';
        lightBg.style.display = 'block'; lightDots.style.display = 'block';
      } else {
        darkBg.style.display = 'block'; darkDots.style.display = 'block';
        lightBg.style.display = 'none'; lightDots.style.display = 'none';
      }
      window.dispatchEvent(new Event('resize'));
    }
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    applyTheme(savedTheme);
    toggleBtn.addEventListener('click', () => {
      const cur = html.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    async function loadMods() {
      const grid = document.getElementById('modsGrid');
      try {
        const res = await fetch('/api/mods');
        const mods = await res.json();
        if (!mods.length) {
          grid.innerHTML = '<p style="color:#aaa;">No mods published yet. Be the first!</p>';
          return;
        }
        grid.innerHTML = mods.map(m => `
          <div class="glass-card">
            <h3>${m.name}</h3>
            <p>by ${m.author} · ${m.type}</p>
            <p style="font-size:0.8rem;">${m.description || ''}</p>
            <button class="install-btn" data-name="${m.name}" data-type="${m.type}" data-content="${encodeURIComponent(m.content)}">Install</button>
          </div>
        `).join('');

        document.querySelectorAll('.install-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const { name, type, content } = e.target.dataset;
            const decoded = decodeURIComponent(content);
            const installed = JSON.parse(localStorage.getItem('installed_mods')||'[]');
            if (!installed.find(m => m.name === name)) {
              installed.push({name, type});
              localStorage.setItem('installed_mods', JSON.stringify(installed));
            }
            let bm = '';
            if (type === 'css') bm = 'javascript:(function(){var s=document.createElement("style");s.textContent='+JSON.stringify(decoded)+';document.head.appendChild(s);})();';
            else if (type === 'js') bm = 'javascript:(function(){'+decoded+'})();';
            try { await navigator.clipboard.writeText(bm); alert('Mod installed & bookmarklet copied!'); } catch { prompt('Copy this bookmarklet:', bm); }
          });
        });
      } catch (err) {
        grid.innerHTML = '<p style="color:#ff5555;">Failed to load mods. Is the API running?</p>';
      }
    }
    loadMods();
  </script>
</body>
</html>
